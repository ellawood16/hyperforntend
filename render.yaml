# Frontend static site on Render. Link this file (or set Root Directory to
# `frontend`) separately from backend/render.yaml. Without the rewrite below,
# deep links and unknown paths return Render's plain "Not Found" and never
# reach React Router / NotFoundPage.
services:
  - type: web
    name: wallet-frontend
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_API_BASE
        sync: false
